<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNAKE APPLE 2D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN / REGISTER -->
    <div id="authScreen" class="screen">

        <div class="auth-box">

            <h1>🐍 SNAKE APPLE 2D</h1>
            <p class="subtitle">Hardcore Apple Challenge</p>

            <div id="loginForm">

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                    autocomplete="username"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button onclick="login()">
                    LOGIN
                </button>

                <p>
                    Belum punya akun?
                    <span onclick="showRegister()">Daftar</span>
                </p>

            </div>


            <div id="registerForm" style="display:none">

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Buat Username"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Buat Password"
                >

                <button onclick="register()">
                    DAFTAR
                </button>

                <p>
                    Sudah punya akun?
                    <span onclick="showLogin()">Login</span>
                </p>

            </div>

            <div id="authMessage"></div>

        </div>

    </div>


    <!-- MENU -->
    <div id="menuScreen" class="screen" style="display:none">

        <div class="menu">

            <h1>🐍 SNAKE APPLE 2D</h1>

            <p>
                Selamat datang,
                <b id="playerName"></b>
            </p>

            <button onclick="startGame()">
                🎮 MULAI GAME
            </button>

            <button onclick="showLeaderboard()">
                🏆 LEADERBOARD
            </button>

            <button class="logout" onclick="logout()">
                🚪 LOGOUT
            </button>

        </div>

    </div>


    <!-- GAME -->
    <div id="gameScreen" style="display:none">

        <header class="game-header">

            <div>
                👤 <span id="gameUsername"></span>
            </div>

            <div>
                SCORE:
                <span id="score">0</span>
            </div>

            <div>
                LEVEL:
                <span id="level">1</span>
            </div>

        </header>


        <main class="game-container">

            <canvas id="gameCanvas"
                    width="600"
                    height="600">
            </canvas>


            <div class="mobile-controls">

                <button onclick="changeDirection('up')">
                    ▲
                </button>

                <div>
                    <button onclick="changeDirection('left')">
                        ◀
                    </button>

                    <button onclick="changeDirection('down')">
                        ▼
                    </button>

                    <button onclick="changeDirection('right')">
                        ▶
                    </button>
                </div>

            </div>


            <div class="game-buttons">

                <button onclick="pauseGame()">
                    ⏸ PAUSE
                </button>

                <button onclick="backToMenu()">
                    🏠 MENU
                </button>

            </div>

        </main>

    </div>


    <!-- GAME OVER -->
    <div id="gameOverScreen"
         class="screen"
         style="display:none">

        <div class="gameover">

            <h1>💀 GAME OVER</h1>

            <h2>
                SCORE:
                <span id="finalScore">0</span>
            </h2>

            <p id="newRecord"></p>

            <button onclick="startGame()">
                🔄 MAIN LAGI
            </button>

            <button onclick="showLeaderboard()">
                🏆 LEADERBOARD
            </button>

            <button onclick="backToMenu()">
                🏠 MENU
            </button>

        </div>

    </div>


    <!-- LEADERBOARD -->
    <div id="leaderboardScreen"
         class="screen"
         style="display:none">

        <div class="leaderboard">

            <h1>🏆 LEADERBOARD</h1>

            <div id="leaderboardList">
                Memuat data...
            </div>

            <button onclick="backToMenu()">
                🏠 KEMBALI
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
                      </html>
